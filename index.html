
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090b10">
  <meta name="description" content="TITAN — Discover movies, explore series, and find your next great watch.">
  <title>TITAN — Your Next Great Watch</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #090b10;
      --bg-soft: #10131b;
      --panel: #151924;
      --panel-2: #1b2030;
      --text: #f6f7fb;
      --muted: #9ba3b7;
      --line: rgba(255,255,255,.09);
      --accent: #e6bd65;
      --accent-hover: #f5d58e;
      --danger: #e45b68;
      --success: #62c99b;
      --radius: 15px;
      --nav-height: 76px;
      --max-width: 1600px;
      --shadow: 0 24px 80px rgba(0,0,0,.48);
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 90px;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "DM Sans", sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body.modal-open { overflow: hidden; }

    button, input, select {
      font: inherit;
    }

    button {
      cursor: pointer;
      color: inherit;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    img { display: block; max-width: 100%; }

    a { color: inherit; text-decoration: none; }

    .hidden { display: none !important; }

    .muted { color: var(--muted); }

    .accent { color: var(--accent); }

    .container {
      width: min(100% - 64px, var(--max-width));
      margin-inline: auto;
    }

    .topbar {
      height: var(--nav-height);
      position: fixed;
      z-index: 100;
      inset: 0 0 auto;
      display: flex;
      align-items: center;
      transition: background .25s, box-shadow .25s;
      background: linear-gradient(to bottom, rgba(6,8,13,.88), transparent);
    }

    .topbar.scrolled {
      background: rgba(9,11,16,.96);
      box-shadow: 0 1px 0 var(--line);
      backdrop-filter: blur(18px);
    }

    .nav-inner {
      width: min(100% - 48px, var(--max-width));
      margin: auto;
      display: flex;
      align-items: center;
      gap: 36px;
    }

    .brand {
      font-family: Manrope, sans-serif;
      font-size: 29px;
      font-weight: 800;
      letter-spacing: 3px;
      white-space: nowrap;
      cursor: pointer;
    }

    .brand span { color: var(--accent); }

    .nav-links {
      display: flex;
      gap: 24px;
      align-items: center;
      flex: 1;
    }

    .nav-link {
      border: 0;
      background: transparent;
      color: #c0c5d0;
      padding: 8px 0;
      font-size: 13px;
      transition: color .2s;
      white-space: nowrap;
    }

    .nav-link:hover,
    .nav-link.active { color: #fff; }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .icon-button {
      border: 0;
      background: transparent;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #e9ebf2;
      font-size: 19px;
      transition: background .2s;
    }

    .icon-button:hover { background: rgba(255,255,255,.1); }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #b98a39, #f4d992);
      color: #17130a;
      display: grid;
      place-items: center;
      font-weight: 800;
      border: 0;
    }

    .hero {
      position: relative;
      min-height: min(780px, 92vh);
      display: flex;
      align-items: center;
      padding: 130px 0 110px;
      background: #11141c;
      overflow: hidden;
    }

    .hero-background {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center 25%;
      opacity: .78;
      transition: background-image .4s ease;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: 
        linear-gradient(90deg, rgba(9,11,16,.98) 0%, rgba(9,11,16,.82) 32%, rgba(9,11,16,.24) 72%, rgba(9,11,16,.3) 100%),
        linear-gradient(0deg, var(--bg) 0%, transparent 45%, rgba(9,11,16,.18) 100%);
      z-index: 1;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 650px;
      animation: fadeUp .6s ease both;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      letter-spacing: 3px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 22px;
    }

    .eyebrow::before {
      content: "";
      width: 28px;
      height: 1px;
      background: var(--accent);
    }

    .hero h1 {
      font-family: Manrope, sans-serif;
      font-size: clamp(42px, 6.5vw, 84px);
      line-height: 1.02;
      letter-spacing: -3px;
      margin: 0 0 20px;
      max-width: 720px;
      overflow-wrap: anywhere;
    }

    .hero-meta {
      display: flex;
      gap: 14px;
      align-items: center;
      flex-wrap: wrap;
      font-size: 13px;
      color: #d3d6de;
      margin-bottom: 20px;
    }

    .rating {
      color: var(--accent);
      font-weight: 700;
    }

    .quality {
      border: 1px solid rgba(255,255,255,.28);
      padding: 3px 7px;
      font-size: 10px;
      border-radius: 4px;
      letter-spacing: 1px;
    }

    .hero-description {
      color: #c5c9d3;
      font-size: 15px;
      line-height: 1.85;
      max-width: 540px;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin: 0 0 28px;
    }

    .button-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      min-height: 46px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      border: 1px solid transparent;
      border-radius: 7px;
      padding: 0 20px;
      font-size: 13px;
      font-weight: 700;
      transition: transform .2s, background .2s, border-color .2s;
    }

    .btn:hover { transform: translateY(-2px); }

    .btn-primary {
      background: var(--accent);
      color: #14110a;
    }

    .btn-primary:hover { background: var(--accent-hover); }

    .btn-secondary {
      background: rgba(255,255,255,.1);
      border-color: rgba(255,255,255,.14);
      color: #fff;
      backdrop-filter: blur(8px);
    }

    .btn-secondary:hover { background: rgba(255,255,255,.17); }

    .section {
      padding: 22px 0 24px;
      position: relative;
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
    }

    .section-title {
      font-family: Manrope, sans-serif;
      font-size: 20px;
      font-weight: 800;
      margin: 0;
      letter-spacing: -.5px;
    }

    .poster-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 18px 14px;
    }

    .shelf {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 3px 1px 16px;
      scrollbar-width: thin;
      scrollbar-color: #353949 transparent;
    }

    .shelf .poster-card {
      flex: 0 0 calc((100% - 70px) / 6);
      min-width: 135px;
    }

    .poster-card {
      min-width: 0;
      cursor: pointer;
      position: relative;
      animation: fadeUp .4s ease both;
    }

    .poster-image-wrap {
      aspect-ratio: 2 / 3;
      position: relative;
      overflow: hidden;
      background: #191d28;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.06);
    }

    .poster-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .35s ease, filter .35s ease;
    }

    .poster-card:hover .poster-image {
      transform: scale(1.055);
      filter: brightness(.72);
    }

    .poster-hover {
      position: absolute;
      inset: auto 0 0;
      padding: 34px 10px 12px;
      background: linear-gradient(transparent, rgba(0,0,0,.92));
      opacity: 0;
      transform: translateY(7px);
      transition: opacity .25s, transform .25s;
      pointer-events: none;
    }

    .poster-card:hover .poster-hover {
      opacity: 1;
      transform: translateY(0);
    }

    .poster-hover-rating {
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
    }

    .poster-favorite {
      position: absolute;
      right: 8px;
      top: 8px;
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.2);
      background: rgba(5,6,9,.7);
      color: white;
      font-size: 17px;
      opacity: 0;
      transition: opacity .2s;
    }

    .poster-card:hover .poster-favorite,
    .poster-favorite.is-favorite { opacity: 1; }
    .poster-favorite.is-favorite { color: var(--accent); }

    .poster-title {
      margin: 10px 0 4px;
      font-size: 12px;
      line-height: 1.5;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .poster-meta {
      display: flex;
      justify-content: space-between;
      gap: 5px;
      font-size: 11px;
      color: var(--muted);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: rgba(0,0,0,.78);
      backdrop-filter: blur(8px);
      overflow-y: auto;
    }

    .modal {
      width: min(950px, 100%);
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      background: #11141d;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 16px;
      box-shadow: var(--shadow);
      position: relative;
    }

    .modal-close {
      position: absolute;
      z-index: 5;
      right: 16px;
      top: 16px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.2);
      background: rgba(5,7,11,.8);
      color: #fff;
      font-size: 22px;
    }

    .detail-backdrop {
      min-height: 320px;
      background-size: cover;
      background-position: center 30%;
      position: relative;
      display: flex;
      align-items: end;
    }

    .detail-backdrop::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(0deg, #11141d 0%, rgba(17,20,29,.25) 75%),
                  linear-gradient(90deg, rgba(17,20,29,.7), transparent);
    }

    .detail-top-content {
      position: relative;
      padding: 38px 35px 24px;
      width: 100%;
    }

    .detail-title {
      font: 800 clamp(28px, 4vw, 48px)/1.15 Manrope, sans-serif;
      margin: 0 0 14px;
    }

    .detail-content { padding: 0 35px 35px; }

    .detail-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 12px;
      color: #c5cad5;
      margin-bottom: 18px;
    }

    .detail-description {
      max-width: 760px;
      font-size: 14px;
      color: #c1c6d1;
      line-height: 1.9;
      margin: 0 0 24px;
    }

    .player-shell {
      width: min(1100px, 100%);
      background: #0b0d12;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      position: relative;
    }

    .player-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 20px;
      background: #131722;
    }

    .player-frame-wrap {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .player-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .toast-region {
      position: fixed;
      z-index: 400;
      bottom: 24px;
      right: 24px;
      display: grid;
      gap: 9px;
    }

    .toast {
      padding: 14px 16px;
      border-radius: 9px;
      background: #202636;
      border: 1px solid var(--line);
      font-size: 13px;
    }
  </style>
</head>
<body>

  <header class="topbar" id="topbar">
    <div class="nav-inner">
      <div class="brand" id="brandBtn">TITA<span>N</span></div>
      <nav class="nav-links">
        <button class="nav-link active" data-page="home">Home</button>
        <button class="nav-link" data-page="movies">Movies</button>
        <button class="nav-link" data-page="tv">TV Shows</button>
        <button class="nav-link" data-page="mylist">My List</button>
      </nav>
    </div>
  </header>

  <main id="mainContainer">
    <!-- HERO SECTION -->
    <section class="hero" id="heroSection">
      <div class="hero-background" id="heroBg" style="background-image: url('https://image.tmdb.org/t/p/original/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg')"></div>
      <div class="container hero-content">
        <div class="eyebrow">TITAN ORIGINAL</div>
        <h1 id="heroTitle">Dune: Part Two</h1>
        <div class="hero-meta">
          <span class="rating" id="heroRating">⭐ 98% Match</span>
          <span class="quality">4K</span>
          <span id="heroYear">2024</span>
        </div>
        <p class="hero-description" id="heroDesc">Paul Atreides unites with Chani and the Fremen while seeking revenge against the conspirators who destroyed his family.</p>
        <div class="button-row">
          <button class="btn btn-primary" id="heroPlayBtn">▶ Play Now</button>
        </div>
      </div>
    </section>

    <!-- CONTENT SHELVES -->
    <div class="container" style="padding-top: 30px;">
      <section class="section">
        <div class="section-heading">
          <h2 class="section-title">Trending This Week</h2>
        </div>
        <div class="shelf" id="trendingShelf"></div>
      </section>

      <section class="section">
        <div class="section-heading">
          <h2 class="section-title">Popular Movies</h2>
        </div>
        <div class="shelf" id="popularMoviesShelf"></div>
      </section>
    </div>
  </main>

  <!-- MODAL CONTAINER -->
  <div class="modal-backdrop hidden" id="modalBackdrop">
    <div class="modal" id="modalContent"></div>
  </div>

  <div class="toast-region" id="toastRegion"></div>

  <script>
    /* =========================================================
       TITAN API INTEGRATION & APPLICATION LOGIC
       ========================================================= */
    const TITAN_CONFIG = {
      tmdbBase: "https://api.themoviedb.org/3",
      tmdbImageBase: "https://image.tmdb.org/t/p/",
      vidsrcBase: "https://vidsrc.sh",
      tmdbApiKey: "c16dc0e5216853e7589c24794cfe9e68",
      language: "en-US"
    };

    const TITAN_API = (() => {
      const cache = new Map();

      async function request(url) {
        if (cache.has(url)) return cache.get(url);
        const response = await fetch(url, { headers: { Accept: "application/json" } });
        if (!response.ok) throw new Error(`API request failed: ${response.status}`);
        const data = await response.json();
        cache.set(url, data);
        return data;
      }

      function tmdbUrl(path, params = {}) {
        const url = new URL(TITAN_CONFIG.tmdbBase + path);
        url.searchParams.set("api_key", TITAN_CONFIG.tmdbApiKey);
        url.searchParams.set("language", TITAN_CONFIG.language);
        for (const [key, value] of Object.entries(params)) {
          if (value) url.searchParams.set(key, value);
        }
        return url.toString();
      }

      function normalize(item, type) {
        return {
          id: item.id,
          type: type || item.media_type || 'movie',
          title: item.title || item.name || "Untitled",
          description: item.overview || "No description available.",
          poster: item.poster_path ? TITAN_CONFIG.tmdbImageBase + "w500" + item.poster_path : "",
          backdrop: item.backdrop_path ? TITAN_CONFIG.tmdbImageBase + "original" + item.backdrop_path : "",
          year: (item.release_date || item.first_air_date || "").slice(0, 4),
          rating: Number(item.vote_average || 0).toFixed(1)
        };
      }

      async function trending() {
        const data = await request(tmdbUrl("/trending/all/week"));
        return (data.results || []).map(item => normalize(item, item.media_type));
      }

      async function popularMovies() {
        const data = await request(tmdbUrl("/movie/popular"));
        return (data.results || []).map(item => normalize(item, "movie"));
      }

      function embedUrl({ id, type = "movie", season, episode }) {
        let path = type === "movie" ? `/embed/movie/${id}` : (season && episode ? `/embed/tv/${id}/${season}/${episode}` : `/embed/tv/${id}`);
        return `${TITAN_CONFIG.vidsrcBase}${path}`;
      }

      return { trending, popularMovies, embedUrl };
    })();

    // UI RENDERERS & STATE
    const state = {
      favorites: JSON.parse(localStorage.getItem("titan_favorites") || "[]")
    };

    function showToast(message, type = "success") {
      const region = document.getElementById("toastRegion");
      const toast = document.createElement("div");
      toast.className = `toast ${type}`;
      toast.textContent = message;
      region.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    function createCard(item) {
      const isFav = state.favorites.some(f => f.id === item.id);
      const card = document.createElement("div");
      card.className = "poster-card";
      card.innerHTML = `
        <div class="poster-image-wrap">
          <img class="poster-image" src="${item.poster}" alt="${item.title}" loading="lazy">
          <button class="poster-favorite ${isFav ? 'is-favorite' : ''}" title="Favorite">♥</button>
          <div class="poster-hover">
            <div class="poster-hover-rating">⭐ ${item.rating}</div>
          </div>
        </div>
        <div class="poster-title">${item.title}</div>
        <div class="poster-meta"><span>${item.year}</span><span>${item.type.toUpperCase()}</span></div>
      `;

      card.querySelector(".poster-favorite").addEventListener("click", (e) => {
        e.stopPropagation();
        toggleFavorite(item);
      });

      card.addEventListener("click", () => openPlayer(item));
      return card;
    }

    function toggleFavorite(item) {
      const index = state.favorites.findIndex(f => f.id === item.id);
      if (index > -1) {
        state.favorites.splice(index, 1);
        showToast("Removed from My List");
      } else {
        state.favorites.push(item);
        showToast("Added to My List");
      }
      localStorage.setItem("titan_favorites", JSON.stringify(state.favorites));
      // Refresh current view if needed
    }

    function openPlayer(item) {
      const modal = document.getElementById("modalBackdrop");
      const content = document.getElementById("modalContent");
      const url = TITAN_API.embedUrl({ id: item.id, type: item.type });

      content.innerHTML = `
        <button class="modal-close" id="modalClose">×</button>
        <div class="player-shell">
          <div class="player-header">
            <h3 class="player-title">${item.title}</h3>
          </div>
          <div class="player-frame-wrap">
            <iframe class="player-frame" src="${url}" allowfullscreen></iframe>
          </div>
        </div>
      `;
      modal.classList.remove("hidden");
      document.body.classList.add("modal-open");

      document.getElementById("modalClose").onclick = closeModal;
    }

    function closeModal() {
      document.getElementById("modalBackdrop").classList.add("hidden");
      document.body.classList.remove("modal-open");
      document.getElementById("modalContent").innerHTML = "";
    }

    async function initApp() {
      try {
        const trendingList = await TITAN_API.trending();
        const popularList = await TITAN_API.popularMovies();

        const trendingShelf = document.getElementById("trendingShelf");
        const popularShelf = document.getElementById("popularMoviesShelf");

        trendingList.forEach(item => trendingShelf.appendChild(createCard(item)));
        popularList.forEach(item => popularShelf.appendChild(createCard(item)));
      } catch (err) {
        showToast("Failed to load TMDB data. Check API key.", "error");
      }
    }

    window.addEventListener("DOMContentLoaded", initApp);
  </script>
</body>
</html>
